<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos do Casamento - Danielle e Daniel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap');

        body {
            background-color: #f5efe8;
            color: #452b29;
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Imagens das flores nos cantos fixadas */
        .flower-left {
            position: fixed;
            bottom: 0;
            left: 0;
            width: max(200px, 20vw);
            opacity: 0.95;
            z-index: 1;
            pointer-events: none;
        }

        .flower-right {
            position: fixed;
            top: 0;
            right: 0;
            width: max(200px, 20vw);
            opacity: 0.95;
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10; /* Garante que o conteúdo fique clicável acima das flores */
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos do cabeçalho D&D */
        .logo-circle {
            width: 70px;
            height: 70px;
            border: 1px solid #a8385d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            font-size: 20px;
            color: #452b29;
            background-color: transparent;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #a8385d;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .subtitle::before, .subtitle::after {
            content: "";
            height: 1px;
            width: 30px;
            background-color: #a8385d;
            margin: 0 15px;
        }

        h1 {
            font-size: 56px;
            font-weight: 400;
            margin: 0;
            line-height: 1.1;
            color: #452b29;
        }

        .ampersand {
            font-size: 32px;
            font-style: italic;
            color: #a8385d;
            margin: 10px 0;
            font-family: 'Cormorant Garamond', serif;
        }

        .date {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #452b29;
            margin: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .date::before, .date::after {
            content: "";
            height: 1px;
            width: 40px;
            background-color: #d1bfae;
            margin: 0 20px;
        }

        /* Área de Upload (Drag and Drop) */
        .instructions {
            font-style: italic;
            font-size: 22px;
            color: #452b29;
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .upload-box {
            border: 1px dashed #b5a496;
            border-radius: 12px;
            padding: 40px 20px;
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-box:hover {
            border-color: #a8385d;
            background-color: #faf7f5;
        }

        .upload-icon-wrapper {
            width: 50px;
            height: 50px;
            background-color: #f7f7f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
        }

        .upload-icon-wrapper svg {
            width: 24px;
            height: 24px;
            stroke: #333;
        }

        .upload-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            color: #111;
            margin: 0 0 5px 0;
        }

        .upload-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: #888;
            margin: 0;
        }

        .upload-box input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Divisória da Galeria */
        .full-divider {
            width: 100vw;
            height: 1px;
            background-color: #e6dfd8;
            margin: 50px 0 30px 0;
        }

        h2.gallery-title {
            font-size: 28px;
            font-style: italic;
            color: #8fa0ab; /* Tom levemente azulado/acinzentado sutil */
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* Galeria Masonry */
        .masonry-grid {
            column-count: 2;
            column-gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 15px;
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .masonry-item img {
            width: 100%;
            border-radius: 2px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner Discreto */
        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid #f3ece4;
            border-top: 3px solid #a8385d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* Rodapé */
        .footer {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            color: #888;
            margin-top: 60px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Flores do Canto (Agora com os nomes atualizados) -->
    <img src="esquerda.png" class="flower-left" alt="Arranjo Floral" onerror="this.style.display='none'">
    <img src="direita.png" class="flower-right" alt="Arranjo Floral" onerror="this.style.display='none'">

    <div class="content-wrapper">
        
        <div class="logo-circle">D&D</div>
        
        <div class="subtitle">Estamos nos casando</div>

        <h1>Danielle</h1>
        <div class="ampersand">&</div>
        <h1>Daniel</h1>

        <div class="date">27 . NOV . 2026</div>

        <p class="instructions">Compartilhe suas fotos e vídeos no nosso álbum compartilhado.</p>

        <!-- Caixa de Upload -->
        <div class="upload-box" id="drop-area">
            <div class="upload-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </div>
            <h3 class="upload-title">Toque aqui para enviar arquivos</h3>
            <p class="upload-subtitle">ou arraste suas fotos e vídeos</p>
            <input type="file" id="fileInput" accept="image/*,video/*" onchange="uploadFile()" />
        </div>

        <div class="spinner" id="loading"></div>
        <div id="message"></div>
        
        <div class="full-divider"></div>

        <h2 class="gallery-title">Momentos Capturados</h2>

        <div class="masonry-grid" id="gallery">
            <!-- As fotos aparecerão aqui -->
        </div>

        <div class="footer">
            * site desenvolvido por Thamiris Castilho
        </div>
    </div>

    <script>
        // ATENÇÃO: COLOQUE AQUI A URL QUE VOCÊ GEROU NO PASSO 3 DO GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = 'COLE_AQUI_A_URL_DO_APP_DA_WEB';

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            if (file.size > 50 * 1024 * 1024) {
                showMessage('Arquivo muito grande. Limite de 50MB.', '#a8385d');
                fileInput.value = "";
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('message').innerText = '';

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                const formData = new URLSearchParams();
                formData.append('fileName', file.name);
                formData.append('mimeType', file.type);
                formData.append('fileData', base64Data);

                // Mostra a foto imediatamente na galeria se for imagem (ilusão de tempo real)
                if(file.type.startsWith('image/')) {
                    addToGallery(e.target.result);
                }

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    showMessage('Arquivo enviado com sucesso!', '#452b29');
                    fileInput.value = ""; 
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('loading').style.display = 'none';
                    showMessage('Erro ao enviar. Tente novamente.', '#a8385d');
                });
            };

            reader.readAsDataURL(file);
        }

        function showMessage(text, color) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            msgDiv.style.color = color;
            setTimeout(() => { msgDiv.innerText = ''; }, 5000);
        }

        function addToGallery(imageSrc) {
            const gallery = document.getElementById('gallery');
            const item = document.createElement('div');
            item.className = 'masonry-item';
            const img = document.createElement('img');
            img.src = imageSrc;
            item.appendChild(img);
            // Insere no topo
            gallery.insertBefore(item, gallery.firstChild);
        }
    </script>
</body>
</html>
